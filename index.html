p1_s2:`<div class="essay paper">
  <p class="section-label">II.</p>
  <p>We try to bring the manifestations of our ideas closer to the “perfected” versions we hold in our heads. ${fnS('s6','Gradually we learn from our mistakes.')} The knowledge <em>must</em> filter up into our ideas. Hegel believes that this process tends towards true freedom, and will eventually liberate us all.${fnR('asymptote')}</p>
  ${fnB('s6',PART_ONE_SECRET_FOOTNOTES.find(f=>f.id==='s6').txt,'fn-secret')}
  ${fnB('asymptote','I think it\'s probably more asymptotic: not sure we will ever get there. More importantly, perhaps, would we like the experience of perfection? I worry it would be like Jyggalag: pure frozen order. Lifeless and grey. The Coldest Iron Cage.')}
  <p>This belief is not predicated on naive optimism. Rather, there is a cold intuition behind it. The most rational ideas survive, spread, and eventually become habitual. It is not an instant process. Often it takes years, or even generations. The assembly line, liberal capitalism, and women’s suffrage were strongly opposed when they first emerged. Today, all are naturalized to the point of banality.</p>
  <p>Hegel witnessed it himself. He was writing nearby at the university while Napoleon destroyed the Prussian army. He saw the Emperor ride through the town, and called him the world-soul on horseback.</p>
  <p>Before the French Revolution, most Jews in Europe were systematically excluded from much of Gentile life. The Jewish ghetto was not a “policy” as much as “how things were.” Then the National Assembly made French Jews citizens. French armies carried the Code wherever they marched. Behind the law came force: they pulled the ghetto gates down in Venice, in Frankfurt, in Rome.</p>
  <p>The Congress of Vienna tried to hold back the tide of history in more ways than one.${fnR('nations')} They re-erected the gates to the ghettos, trying to seal the past away. But what had been done could not be undone. People understood that the Jews didn’t have — or want — to live in ghettos. The ghettos now required justification.</p>
  ${fig(IMG.davidAlps,'Napoleon in a billowing red cloak on a rearing white horse, pointing upward through an Alpine pass, with soldiers hauling a cannon up the rocks behind him and three names carved into the stone in the foreground.','He made the actual crossing on a mule. Note the names cut into the rock beneath him: BONAPARTE, ANNIBAL, KAROLVS MAGNVS. He picked his own predecessors.','plate--tall')}
  ${fnB('nations','The revolutions of 1848 were defeated almost everywhere within two years. But serfdom was abolished across the Habsburg lands and never restored. Prussia came out of it with a constitution it had never had before. And the civil equality granted to Jews that year, revoked in the reaction, was granted again permanently within twenty. Each defeat left the baseline higher than where it started.')}
  <p>It was not Spirit. It was legislators arguing in a chamber, soldiers with crowbars, and men dying for their citizenship. That is true of any sort of social change. Each human, a nerve cell in the greater whole. ${fnS('s2','We live in a society, after all.')}</p>
  ${fnB('s2',PART_ONE_SECRET_FOOTNOTES.find(f=>f.id==='s2').txt,'fn-secret')}
  <p>These processes scale up, then feed back down. Ideas build on ideas. Nations challenge nations. Systems adapt or collapse. Winners continue and losers cease to exist. All these lessons accumulate, then form something new from both the successes and failures. Hegel calls this process Sublation or Aufhebung.</p>
  <p>Hegel might be right, but I see it differently. He calls it unfolding. I would call it provisional. We look at the world, guess which causes matter, and act on the guess. In a universe filled with a near infinite number of events, separating signal from noise sometimes feels impossible. In the moment of decision, all we can do is make a Judgment on which is which and hope we are correct. The world provides validation: we get to see whether our predictions came true. Then our Judgment reshapes the world.${fnR('contingency')}</p>
  ${fnB('contingency','Hegel thought that nature had a rationality of its own, but it was “cloaked under contingency”. To me, the ability to recognize abstract structures or patterns is a power of man. This is reflexivity.')}
  <p>However, these Judgments are temporary. Logically, if a Judgment shifts the world, humans will learn and alter their behavior accordingly, thereby shattering the very assumptions that undergirded the correct Judgment.${fnR('cannonball')}</p>
  <p>From the wreckage, a new Judgment will of course emerge. If that Judgment proves eternal, then congrats: history has ended. Spirit has seen itself, if only for a moment.${fnR('wuwei')}</p>
  ${fnB('cannonball','Perhaps less so in the hard sciences and more so in the more subjective social sciences. A cannonball dropped from a leaning tower does not analyze its own trajectory down but a human certainly does. Goodhart captured this problem with his eponymous law.')}
  ${fnB('wuwei','And in the long run, we are all dead. Perhaps worrying about all this is pointless. Just let things unfold and enjoy the ride. Wu Wei?')}
  ${p1Footer()}
  <div class="p1-page-nav">
    ${nav('p1_s1','← I')}
    ${nav('p1_s3','→ III')}
  </div>
</div>`,

p1_s3:`<div class="essay paper">
  <p class="section-label">III.</p>
  <p>My issue with Hegel’s grand vision is that I think Hume is right about our vantage point. Our ability to know things is profoundly limited. Unlike Hegel’s Spirit, we do not have the luxury of a space outside of time to disinterestedly judge. We are thrown into the world and embodied in our context. As a result, we must bite the bullet on induction: we almost always accept that what was true before will continue to hold true in the future.</p>
  <p>For the most part, this shortcut works. The sun rises every morning, after all. The money in your bank account is still there when you check it. The real problem is that many other Judgments only stay accurate if the facts underlying them do not change. But intuitively we understand that facts do, in fact, change. Every moment we have new sensations, more data to synthesize. Every Judgment must be updated in parallel to changes in the world itself to remain accurate. No man can step in the same river twice. He is not the same man and it is not the same river. The tension between actually existing reality and our temporally bound Judgments is ${fnS('s7','an endless confrontation.')}</p>
  ${fnB('s7',PART_ONE_SECRET_FOOTNOTES.find(f=>f.id==='s7').txt,'fn-secret')}
  <p>Perhaps the dialectic is merely the name humans give the unstable churn of existence. New Judgments arise to fill in the gaps left by blind spots or changes. This is history.</p>
  <p>Much of this comes down to what we humans are like. We are reflexive, so we “teach” institutions by incorporating the lessons we feel are valuable. We have agency, and actively choose what gets encoded and passed down.${fnR('marx')}</p>
  ${fnB('marx','This is part of why many people are scared of Marx. He intended his writings to change the world by convincing people to act according to his predictions. Accelerationist Nick Land termed this “Hyperstition”.')}
  <p>But ideas do not stay in heads. Successful ones get built, and they get enforced. That is how they persist, and it is how they transmit from person to person. You cannot gift someone a stove without explaining what a stove is for.</p>
  <p>How do we know about prehistory? We have the artifacts and nothing else. Lascaux is seventeen thousand years old and every reading of it is our best guess. For them it was not a question. Objects survive us. Our reasons do not.</p>
  ${fig(IMG.lascaux,'A frieze of animals drawn across a pale limestone wall, caught in a beam of light: a large horned cow stands among dozens of overlapping horses, with checkerboard signs at her feet and the rest of the panel fading into shadow.','','plate--mid')}
  <p>Then we learned to write things down. History begins, or at least the record does. Now meaning can be attached to objects and perhaps understood across space and time. Socrates complains that written language alters how his students think. We know he thought that because Plato wrote it down.${fnR('virus')}</p>
  ${fnB('virus','Burroughs said something like “language is a virus from outer space,” which is either an overstatement or the most accurate sentence in English.')}
  <p>${fnS('s3','Back in college, I took a class on the political history of the future or something.')} It was a survey of how people, over time and space, have conceived of “the future”. It began with an exploration of how medieval Europe viewed the kingdom to come: time was created and understood by God alone.</p>
  ${fnB('s3',PART_ONE_SECRET_FOOTNOTES.find(f=>f.id==='s3').txt,'fn-secret')}
  <p>They built calendars and tracked time with this in mind. To them, Revelation was the rational end to all things. Ritual and habit anchored their world; belief mandated practice and practice reinforced belief. Visible flux was suppressed and the world appeared stable. Persistence served as the ultimate proxy for success.${fnR('religion')}</p>
  ${fnB('religion','This power is why thinkers from Confucius to Machiavelli to Weber have treated religion as a tool for structuring political life: it forces people into habit. And habit becomes reason.')}
  <p>The belief was load-bearing, and that is the part we cannot get back. It’s not that we don’t know. We can reconstruct exactly why, from the documents and the record. But that way of understanding the world is foreclosed to us. We have learned too much.</p>
  <p>We still use the Church’s calendar. Every four years we add a day to February to keep Easter in place. Everything else you schedule rides on that.</p>
  <p>We cannot recover the past with certainty. The future is not yet built. So people guess what is to come based on what they have decided happened before. Opaque on both ends. Can we at least be sure of a Judgment in the moment we make it?</p>
  ${fig(IMG.mars,'March, from the Très Riches Heures du Duc de Berry (c. 1412–1416). Peasants plow beneath the Château de Lusignan while the zodiac marks the season above.','The seasons do not operate on mankind\'s time. The castle looms; the peasant plows; the zodiac turns. Ritual and habit as rational order.','plate--narrow')}
  <p>Hume thought so. In “Of the Standard of Taste” he argued that it was possible to “objectively” rank the quality of art. To him, good art is what persists over time and across cultures.</p>
  <p>But durability cannot be measured in a single moment. By definition, it is persistence over time. Hume proves it himself. He names two comparisons he takes to be self-evidently absurd: Ogilby with Milton, and Bunyan with Addison. The first still holds — nobody defends Ogilby. The second has inverted. <em>Pilgrim’s Progress</em> is still read. Addison is not. His own Judgment did not survive.</p>
  <p>He built the test. Then he proved it correct. In the end, the judge cannot know in the moment if they will be vindicated.</p>
  ${p1Footer()}
  <div class="p1-page-nav">
    ${nav('p1_s2','← II')}
    ${nav('p1_s4','→ IV')}
  </div>
</div>`,

p1_s4:`<div class="essay paper">
  <p class="section-label">IV.</p>
  <p>This does raise a problem: if we start to perceive our own structures as unchangeable because they are stable, we are caught flat-footed when the world reveals its changes, destroying our priors and fracturing our inductive chain. Don't believe me? Look at history.</p>
  <p>Tokugawa Japan was closed off from the rest of the world. ${fnS('s4','High literacy and a well-developed mass market visual culture.')} A Shogunate structured around ritual journeys to and from the capital that kept elites on a tight leash. Very effective repression of commoners and foreigners. Result? Centuries of what most would call peace.${fnR('peasants')} Since it persisted for so long, it appeared to those inside as the most rational system. Alas, it did not last: Europe's Fiscal-Military states were about to teach the rest of the world a deadly lesson.</p>
  ${fnB('peasants','There were plenty of peasants who didn\'t think so. But they didn\'t win. Mere footnotes.')}
  ${fnB('s4',PART_ONE_SECRET_FOOTNOTES.find(f=>f.id==='s4').txt,'fn-secret')}
  ${fig(IMG.perry,'A Japanese print portrait of Commodore Perry in dark naval uniform.','A Japanese print portrait of Commodore Perry in dark naval uniform. This is more respectful than some of the portraits made by other contemporary Japanese artists.','plate--narrow')}
  <p>Japan wasn't blind to the changing outside reality. Far from it: it felt the storm coming. It saw what happened to China: its craftsmen depicted the Opium Wars in woodblock prints of battle and death. It knew the Europeans were about to arrive: the Shogun had received warnings from the Dutch King himself.${fnR('dutch')} Japan and its people began to understand the world had changed. The heat was building. When Commodore Perry and his Black Ships appeared in Tokyo Bay, the Shogun and many Daimyos deduced Japan would burn next. That deduction bred fear. And that fear bred action.</p>
  ${fnB('dutch','Of course, the Dutch King\'s letter wasn\'t some sort of generous gift: it was a rational act to try and resolve the tension brewing between Japan\'s isolationism and Britain\'s gunboat free trade in Asia.')}
  <p>Japan was thus confronted by a contradiction the existing system could not solve: its old rational way of structuring life turned out to be just a moment, not eternity. Confronted by this contradiction, Japan made a new Judgment.</p>
  <p>The result was something novel. Japan was modern <em>but on its own terms</em>. By maintaining a form of their own culture while adopting European ideas, they became different from both their past and contemporary Europeans.${fnR('tsushima')}</p>
  ${fnB('tsushima','Japan was recognized as “Western” when it defeated Russia at Tsushima and Mukden in 1905. But then it was different again in 1945. You get my drift. All this just because they saw Perry come across the horizon with a few black ships.')}
  <p>This isn't the full story, however. Zoom in for a second and you'll notice something uncanny: the same dynamic that happened <em>to</em> Japan happened <em>within</em> Japan. The actors in Japan had the experience of Japan, miniaturized. The pattern is fractal.</p>
  <p>Choshu and Satsuma, the modernizing Japanese Domains, chafed under the tight leash of the Shogunate. Satsuma controlled Ryukyu,${fnR('okinawa')} one of Japan's limited traditional gateways to the outside world. Both had already fought the British navy and lost. They understood the threat and promise of the foreigners better than any other Domain. They experienced the Dialectic most directly: the old structure dying, but the new one not yet being built. Soon, Japan would have no choice in the matter. They decided to act.</p>
  ${fnB('okinawa','Today\'s Okinawa. Funny how the Americans ended up there, eh?')}
  <p>In what became known retroactively as the Sat-Cho alliance, the two Domains aligned to destroy the old world. Choshu forged a European-style conscript army to oppose the traditional forces of the shogunate. They armed commoners, defying the 250-year tradition restricting weapons to only samurai. Satsuma, for its part, sent its youth to Britain to learn modern shipbuilding and industrialization, in direct opposition to the laws of the shogunate and their own stated ideals.${fnR('rivalry')} On arrival, the Satsuma students visited dockyards and wore English three-piece suits. On return, these youth would go on to create the Meiji state, and guess what? They all kept the suits.</p>
  ${fnB('rivalry','Some scholars attribute the infamous Imperial Japanese army/navy interservice rivalry to this split. You could also argue that this represents the dual consciousness of Meiji Japan: British naval-liberal constitutionalism juxtaposed with Prussian army-junker militarism.')}
 
 
  ${figPair([
    {src:IMG.ambassadors,alt:'Members of the 1860 Japanese mission to the United States in traditional dress.',caption:'Members of the 1860 Japanese mission to the United States in traditional dress. The old order meets the future bosses.'},
    {src:IMG.satsuma,alt:'Young Satsuma students in Western suits pose for a studio portrait.',caption: 'Young Satsuma students in Western suits pose for a studio portrait. The new order teaches the old.'}
  ])}
  ${p1Footer()}
  <div class="p1-page-nav">
    ${nav('p1_s3','← III')}
    ${nav('p1_s4b','→ V')}
  </div>
</div>`,

p1_s4b:`<div class="essay paper">
  <p class="section-label">V.</p>
  <p>Can you argue with the results? Sat-Cho's modern military repeatedly routed the antiquated Shogunate forces, who then embarked on their own program of modernization. ${fnS('s5','It was an arms race, but the Shogunate had started too late.')} The early competitive advantage meant that the Shogunate was effectively playing catch-up to the Domains.</p>
  ${fnB('s5',PART_ONE_SECRET_FOOTNOTES.find(f=>f.id==='s5').txt,'fn-secret')}
  ${fig(IMG.drill,'A woodblock print of soldiers drilling and charging through smoke and open ground.','A woodblock print of soldiers drilling and charging through smoke and open ground. What space is there for the samurai in this new world?')}
  <p>Sat-Cho did not abandon the past but instead recontextualized it. They said, “Shogun, you are illegitimate because you cannot expel the barbarians. Thus, we must return to tradition and get the emperor back in power to expel the barbarians.” Sonno-Joi.${fnR('emperor')}</p>
  ${fnB('emperor','Never mind that the Emperor had been sidelined by the Shogun during the great period of peace when the foreigners were completely restricted.')}
  <p>Do you see it? The Contradiction? To restore tradition, they had to become modern. To become modern, they had to restore tradition. The premise required the conclusion that required the premise. Inductively and deductively, this chain of reasoning makes sense as a pattern, but there is an uncomfortable circularity. The founding document of the Meiji order itself makes this tension explicit:</p>
  <p class="pullquote">Knowledge shall be sought throughout the world so as to strengthen the foundations of imperial rule.${fnR('charter')}</p>
  ${fnB('charter','The Charter Oath of 1868 was a self-conscious attempt to become modern. It promised: democracy, equality, progress. In reality: oligarchy, stratification, progress.')}
  <p>The Satsuma-Choshu Alliance came out on top of what became known as the Boshin War. In victory, the two domains remade Japan in their own image: a modernized traditionalism.${fnR('trad')} Railways, Zaibatsu megacorporations, and imperial conquests, all with an “Eternal Emperor” who had reigned uninterrupted for thousands of years at its head. Today, those years are measured on the Church’s calendar. Things changed but they also stayed the same.</p>
  ${fnB('trad','Traditional Japanese culture persisted. But the Japanese state now understood that it could choose what counted as traditional. Hence the emergence of state Shinto and the suppression of supposedly foreign Buddhism.')}
  <p>That's the dialectic in action: Adapt or die. Fuse the outside world with yourself. Reconcile yourself with change and claim it as your own. Schumpeterian creative destruction applied to the state and society and the individual.</p>
  ${fig(IMG.boxers,'A Japanese woodblock print of Captain Higuchi shielding an abandoned Chinese infant while directing his men.','Captain Higuchi shields an abandoned Chinese infant at Motianling, First Sino-Japanese War, 1894–95.')}
  <p>Japan would then go on to help Korea and China learn this lesson. It started with good intentions. A kind older brother who wants to protect the rest of Asia from rapacious Europeans. Of course, this generosity was ephemeral. In Korea, cultural genocide and comfort women. In China, Nanjing and Unit 731. But hey, at least it wasn't the damn Europeans doing it.</p>
  <p> But of course Japan had become European in a way. The Eight-Nation Alliance was a collaboration between Japan and European powers to suppress the Boxers. Japan took concessions from China, just like the rest of the Europeans. They dressed like the Europeans and listened to European classical music. The Japanese had become equal to the Europeans and were recognized as such. Asia had been successfully “Thrown off”. When the boot is on your neck, what difference does its nationality make?</p>
  ${fig(IMG.courtesan,'A woodblock print of a Western man and Japanese woman sharing an interior scene.','A woodblock print of a Western man and Japanese woman sharing an interior scene. Madame Butterfly had a long history in Japan before Puccini wrote the opera.','plate--narrow')}
  ${p1Footer()}
  <div class="p1-page-nav">
    ${nav('p1_s4','← IV')}
    ${nav('p1_s5','→ VI')}
  </div>
</div>`,


p1_s5:`<div class="essay paper">
  <p class="section-label">VI.</p>
  <p>The mask drops: the dialectic is value-neutral. It explains how to survive, but nothing inherently “good” guides the process. It is power manifest. ${fnS('s8','Gravity. Force.')}</p>
  ${fnB('s8',PART_ONE_SECRET_FOOTNOTES.find(f=>f.id==='s8').txt,'fn-secret')}
  <p>Spin the globe and zoom in on the Caribbean of the 1700s. The Atlantic Enlightenment is in full swing, fueled by coffee and sugar. Both become almost as valuable as gold. Not so valuable that free men are willing to do the back-breaking labor required to make plantations profitable.</p>
  <p>Luckily, the Portuguese had figured out a solution: import slaves from West Africa. Many of those rational Europeans who decried slavery had no qualms if the slaves were taken in “just wars” by and from African statelets up and down what would become known as the Slave Coast.${fnR('complicity')} Enslaving the defeated is what glorious Rome did, said Grotius. Thus, the Middle Passage is born.</p>
  ${fnB('complicity',"Of course, the African kingdoms were also complicit, but it was a rational complicity. They were making Judgments too. Those who did not participate in slave taking would become slaves of their neighbors who did.")}
  <p>Although the English took pride in their opposition to slavery within England's borders, the siren call of profit proved too hard to ignore.${fnR('norman')} They staffed their initial Caribbean plantations with indentured servants from the British Isles. However, the transition to sugar cultivation created a near-endless need for labor that the supply of willing (or even unwilling) Europeans could never meet. Out of necessity, England too turned towards African Slavery. The African Company was formed and given Royal imprimatur. Soon Britain is fully enmeshed in the slave trade, eventually taking over the Asiento contract to supply the Spanish Empire with slaves.</p>
  ${fnB('norman','Never mind that it was the Norman Conquest that finished off slavery. Perhaps the Norman Yoke was not all that much of a yoke. As much as I like Tolkien, I can\'t help but feel his romantic English Nationalism is a more palatable version of Heidegger\'s Black Forest Naziism.')}
  <p>Journeys across the Atlantic remain difficult. The <em>Zong</em>, a British slave ship, misjudges the distance to Jamaica and spends a bit of extra time at sea. Suddenly, that pleasant 60 day journey instead becomes an unbearable 108. But these voyages are rationalized and economized: a ship only carries as much supply as it needs to complete the journey. Every ounce of water is one less pound of cargo and one less pound of profit. When supplies run low, the slaves are the ones who are not fed. Unfortunately for the owners of the <em>Zong</em>, slaves decrease in value if they are sick or weak. A slave's lifespan is “priced in”, as plantation foremen are unlikely to buy the unhealthy slaves when the ship finally docks at Black River.</p>
  ${fig(IMG.kingston,'A hillside view over hedged fields to the town of Kingston and its harbor, where ships lie at anchor and a long spit of land runs out to Port Royal, with mountains across the water. In the foreground a man in a black top hat points out over the view; beside him stands a woman in a long white dress and a striped shawl, next to a tall flowering agave.','A British plantation owner points to what makes the Empire grand: buildings, roads, ships loaded with sugar. Not a slave in sight.','plate--mid')}
  <p>All hope is not yet lost, as Rome comes to the rescue once again. In the coffeehouses of London, the underwriters at Lloyd's reach for the <em>Lex Rhodia de iactu</em>, an old rule holding that losses from jettisoned cargo are shared proportionally. They begin applying it to slaves.</p>
  <p>The ancient rule, now known as the “Law of the General Average”, becomes an economic life vest for the shipowners. Insurers will compensate them for any cargo sacrificed to save the ship. Incentives are aligned: captains are pushed to save the ship when the vessel itself is at stake, as they no longer have to worry quite as much about explaining how they lost all the cargo to their patrons back in Liverpool.</p>
  <p>All this because some men have realized that slaves are, in fact, cargo.</p>
  <p>One hiccup in the fine print. Insurance will only cover accidents, not natural deaths. The captains of these expeditions are consummate businessmen, hired to protect the returns of the investors back in Britain. So, of course, they understand the law. The <em>Zong</em>'s Captain is thus left to face a time-bound decision: if slaves die natural deaths, insurance will not pay out.</p>
  <p>The Captain on the <em>Zong</em> judges. The rational solution is clear.</p>
  <p>He acts.</p>
   ${fig(IMG.slaveShip,'A blazing orange sunset over a heaving sea; a ship with furled sails recedes into the coming storm while in the foreground a shackled leg juts up out of the water among converging fish.','Before sublime nature, both the <em>Zong</em> and the drowning slave are miniscule.','plate--mid')} 
  <p>Throw the still living slaves overboard, claim them as jettisoned cargo and demand insurance pay £30 a head. Problem solved. The Captain has done his duty. The investors will be made whole. The insurers are furious about this loophole and refuse to pay.</p>
  <p>The 130 slaves tossed overboard are dead, silent in the vast Atlantic waters.</p>
  <p>When the ship returns to London, its owners sue. The trial concerns insurance money, not murder. That question is not even considered, as slaves are cargo in the eyes of the rational law. The jury, made up of the British elite, understands the stakes: dastardly France has perfected the slave economy on the hell colony of Saint-Domingue.${fnR('choiseul')} Thus, if the insurers win, the flow of slaves to Jamaica slows, the economy of the British West Indies sputters, and the French solidify their grip on the sugar trade. Of course, they find for the owners.</p>
  ${fnB('choiseul','Britain’s choice to take Canada instead of the French sugar islands at the Treaty of Paris in 1763 looks worse every year. Voltaire’s few acres of snow are out-earned by Guadeloupe alone. Now the thirteen colonies Britain fought to protect have broken away with French help. Choiseul will live two more years — long enough to see his wager pay off. Saint-Domingue has eight years left.')}
  <p>${fnS('s9','Another win for rationality.')}</p>
  ${fnB('s9',PART_ONE_SECRET_FOOTNOTES.find(f=>f.id==='s9').txt,'fn-secret')}
  ${p1Footer()}
  <div class="p1-page-nav">
    ${nav('p1_s4b','← V')}
    ${nav('p1_s6','→ VII')}
  </div>
</div>`,

p1_s6:`<div class="essay paper">
  <p class="section-label">VII.</p>
  <p>Unfortunately for the owners, the ruling is not the end of the story.</p>
  <p>Olaudah Equiano, the formerly enslaved African, follows the trial closely. He endured the Middle Passage personally, and so understands it in a way no one else can. He gives literal voice to a horror that, for everyone else, is secondhand. As a free African in London, he is a refutation of the caricatures of his race. Literate, Christian, employed. He calls on gentlemen and is received.</p>
  <p>He visits Granville Sharp to inform the prominent abolitionist of the result of the trial. Unlike Equiano, Sharp is no outsider: born into impeccable Anglican lineage, grandson of an Archbishop of York. He had played a decisive role in <em>Somerset v Stewart</em>, a case that has been interpreted ever since as affirming the rights of slaves on British soil. Sharp is appalled by the <em>Zong</em>.</p>
  <p>He reaches for the law, as it has served him before. He attends the appeal, hires a shorthand writer to transcribe it, and presses for the owners to be tried for murder.</p>
  <p>He fails.</p>
  <p>He does not cease his efforts. Four years later he co-founds the &ldquo;Society for Effecting the Abolition of the Slave Trade&rdquo;: a committee of twelve, nine of them Quakers. As an Anglican among Dissenters, he brings a name the British establishment cannot dismiss. He is chosen as chair.</p>
  <p>Josiah Wedgwood soon joins the twelve. He is a Unitarian &mdash; barred, like the Quakers around him, from the universities and the professions, and gone into trade instead. He does not make porcelain for the elite. He mass-produces jasperware.</p>
  <p>So Wedgwood contributes in the way he knows how. He cuts a cameo of a kneeling slave, with the words &ldquo;Am I Not a Man And A Brother?&rdquo; raised above him. He manufactures them by the thousand, then gives them all away. The image spreads like a meme: to bracelets, snuffbox lids, brooches; women wear them in their hair, fanning the anti-slavery flames across Britain.</p>
  <p>An idea has become embodied in physical reality.</p>
  ${fig(IMG.cameo,'The Wedgwood anti-slavery cameo: a kneeling enslaved man in profile with the inscription \u201cAm I Not a Man And A Brother?\u201d','Although it is sometimes seen as problematic in its depiction of a supplicant African, I think it represents the reality of the situation accurately. Sometimes the truth is painful.','plate--narrow')}
  <p>Eventually, Parliament abolished the slave trade. Twenty-six years later, slavery itself was outlawed.${fnR('recompense')} Wedgwood, Equiano, and Sharp were long dead. The Judgment that allowed the <em>Zong</em> never died; it simply stopped having anything to apply to.</p>
  ${fnB('recompense','Don\'t feel too bad for the slaveowners: they received a healthy recompense from the British treasury. The freed slaves got nothing.')}
  <p>What replaced it was a global campaign, led by Britain, to suppress the slave trade wherever it still ran. Empire and Abolition went hand in hand: as the British empire expanded, so did the campaign against slavery. Slavery\u2019s survival justified reaching back into the very regions where Britain had once trafficked in bodies \u2014 to destroy that same trade, and administer the land. The other European states followed suit.${fnR('indigenat')}</p>
  ${fnB('indigenat','France abolished slavery in its colonies in 1848 and made the former slaves citizens outright. Two of France\u2019s remaining Caribbean colonies, Martinique and Guadeloupe, sent deputies to Paris that same year. They were lucky: the people of every territory France took afterward were granted subjecthood at gunpoint. Classed as <em>indig\u00e8nes</em> under the Code de l\u2019indig\u00e9nat, they could be punished without trial and conscripted to labor. France did not abolish the practice until 1946, ninety-eight years after emancipation.')}
  <p>At the Berlin Conference of 1884, the European powers entrusted Belgian King Leopold II with a huge swath of Central Africa. It was wracked by slavery, as the Sultans of Zanzibar made great profit from the trade east to their island. Leopold promised he would end the trade and bring civilization to the Congo Basin.</p>
  <p>To educate the Africans, he established the Congo Free State. He brought modern Christianity and European science to these deprived people. Of course, Leopold knew the right man to govern darkest Africa. He appointed Tippu Tip, an active Zanzibari slave trader, as governor of Stanley Falls. The man had experience, after all. Rationality unfolded; freedom triumphed.</p>
  <p>Everyone clapped.${fnR('hands')}</p>
  ${fnB('hands','Except the Congolese whose hands had been chopped off by Leopold\'s Force Publique. Plus \u00e7a change\u2026')}
  ${fig(IMG.diagram,'A schematic drawing of the slaveship Brooks demonstrating the cramped conditions of a Middle Passage journey.','The stowage plan of the <em>Brooks</em>, a slave ship. Abolition took many years to unfold, and the Slave Trade Act of 1788 was one step along the way: it limited how many slaves a ship could carry, and aboard the <em>Brooks</em> the number allowed fell from 609 to 454. Planters and abolitionists supported it together, for different reasons. Another great humanitarian victory born of compromise.','plate--mid')}
  <p>Hegel and his disciples \u2014 Marx among them \u2014 have noticed a pattern. Horror is necessary for the world to progress. The <em>Zong</em>? A textbook demonstration. Reason demanded that hundreds of people be thrown overboard; luckily, it learned an important lesson. Life exists outside the ledger. A profound development!</p>
  <p>I\u2019ve always found this argument unsatisfying. In form, it resembles theodicy to an uncomfortable degree: evil exists so that good can vanquish it. Will it? Eventually. Nothing guarantees it. ${fnS('s11','It could be a story we tell ourselves to make sense of it all.')} The Dialectic doesn\u2019t care. It continues no matter how much we want it to stop.</p>
  ${fnB('s11',PART_ONE_SECRET_FOOTNOTES.find(f=>f.id==='s11').txt,'fn-secret')}
  <p>I worry, as Hegel did, that even the noblest intentions can be subordinate to rational ends. Unlike Hegel, I am not able to abstract away the sacrifices. The slaughter-bench consumes more than happiness, wisdom, virtue.</p>
  <p>It consumes men.</p>
  <p>The 130 slaves remain drowned off the coast of Jamaica.</p>
  ${p1Footer()}
  <div class="p1-page-nav">
    ${nav('p1_s5','\u2190 VI')}
    ${nav('p1_s7','\u2192 VIII')}
  </div>
</div>`,

p1_s7:`<div class="essay paper">
  <p class="section-label">VIII.</p>
  <p>A nerve cell cannot see what the whole is building. Take the samurai. I did not tell you the full story. The pattern is fractal, after all.</p>
  <p>Satsuma and Choshu had fought on the losing side at Sekigahara back in 1600. Both submitted when Tokugawa victory became inevitable and were spared, but thereafter remained stigmatized as Tozama \u2014 \u201cOutsider Lords&rdquo;. The Shogunate kept potentially disloyal domains weak and under watch through costly public works and <em>sankin-k\u014dtai</em>. It bought more than two centuries of peace. It also ensured that the defeated never forgot who had defeated them.${fnR('mori')}</p>
  ${fnB('mori','Mori Terumoto, lord of the territory that became Choshu, had been one of Hideyoshi\'s Council of Five Elders. After Sekigahara, the Mori lost nearly three-quarters of their lands and were confined to two comparatively poor provinces. Satsuma retained its territory but remained burdened by its unusually large samurai class.')}
  <p class="pullquote">Every New Year's Day for 250 years, Choshu samurai would approach the Daimyo and ask:<br><br>\u201cHas the time come to begin the subjugation of the Shogunate?&rdquo;<br><br>And for 250 years, the Daimyo would reply:<br><br>\u201cNo. The time is not yet ripe.&rdquo;</p>
  <p>When the Black Ships showed up in Tokyo Bay, the Tozama and their samurai were itching to strike. These men were competent, driven, and angry. Many leaders of what was later called a Restoration came from the samurai class, including Saigo Takamori, instrumental in Satsuma's rise.</p>
  <p>However, most samurai were rendered antiquated by European modernity. The literati virtues that had sustained the samurai as a class during the Shogunate were useful, but no longer unique. A modern bureaucratic state does not need a bunch of warrior-poet wannabes, as clerks and conscripts are much more useful. Shorn of purpose, the unfortunate samurai fell into penury.</p>
  <p>In the end, the Meiji oligarchy only fulfilled half the promise of sonno-joi: they restored the emperor but invited the barbarians directly into the house for tea. And as a final twist of the knife, the Meiji elite stripped sword rights from the samurai, effectively abolishing the traditional symbol of samurai class distinction.${fnR('haitorei')} The new state asserted its monopoly of violence.</p>
  ${fnB('haitorei','This was known as the Hait\u014drei. Of course, the Daimyos were allowed to keep their swords. No proper European Aristocrat would be caught dead without one.')}
  ${fig(IMG.shiroyama,'A woodblock print of the Battle of Shiroyama.','The Battle of Shiroyama, 1877. The last stand of the samurai. Krupp artillery against katanas.','plate--mid')}
  <p>It could not have come as a surprise to the Meiji leadership that these now dispossessed samurai would rise in revolt. Luckily, they had just the right tools to suppress the uprising. The conscript army introduced by Choshu was primed to destroy their former betters.${fnR('transcended')} The Imperial Navy forged by Satsuma blockaded the coast and penned the samurai in. In command stood many of the very men who had led the samurai to war against the Shogun.</p>
  ${fnB('transcended','The peasants transcended their footnote status. Now the turn of the samurai.')}
  <p>Bushido proved no match for the new order. The rebellion ground on for eight months, and what was left of it \u2014 400 men \u2014 dug in on the hill at Shiroyama, surrounded by 30,000 imperial conscripts. The army spent days walling them in and shelling the hillside from land and sea. When the assault came before dawn, the survivors charged down into it, and Gatling guns cut them apart. Saigo Takamori killed himself.${fnR('takamori')}</p>
  ${fnB('takamori','And then the Meiji oligarchs used him as a great example of Japanese honor and determination.')}
  <p>Popular history fixates on the arquebus ending European honor culture, but the Krupp cannons manned by former peasants cut down the flowers of Japanese chivalry more effectively. The samurai who had restored the emperor to power were liquidated in his name.</p>
  <p>Every one of them was a nerve cell in the greater whole, and Geist (as Hegel calls Spirit) does not feel a nerve cell. You may be the one offered up. The samurai made the right Judgments. Where did they end up? Charging Gatling guns at dawn. Today they are a symbol of honor, of futility, of a past no longer accessible.</p>
  ${fig(IMG.armies,'A triptych showing Japanese and foreign military uniforms assembled in comparative display.','A triptych showing Japanese and foreign military uniforms assembled in comparative display. The Japanese portray themselves as indistinguishable from their Russian opponents outside of their uniforms.')}
  <p>The Owl of Minerva only appears at dusk: ${fnS('s10','we can only see the pattern in retrospect.')} The samurai built the very boot that would snap their necks. Would they have destroyed the Shogunate if they had known the result?${fnR('unfolding')}</p>
  ${fnB('s10',PART_ONE_SECRET_FOOTNOTES.find(f=>f.id==='s10').txt,'fn-secret')}
  ${fnB('unfolding','How could I be sure that I am not doing the same? Can I even see the unfolding well enough to, if not stop it, steer it?')}
  ${p1Footer()}
  <div class="p1-page-nav">
    ${nav('p1_s6','\u2190 VII')}
    ${nav('p1_s8','\u2192 IX')}
  </div>
</div>`,

p1_s8:`<div class="essay paper">
  <p class="section-label">IX.</p>
  <p>The problem with thinking is that you can't unthink. Theories feel less like something you hold and more like something that has begun to hold you. If ideas really do become tools, then somewhere the tools <em>must</em> exist, continuing to do what they were built to do, whether anyone remembers the reason that built them or not.${fnR('must')}</p>
  ${fnB('must','Must they? Or do I <em>need</em> them to?')}
  <p>And once you suspect that, you start wanting to see them for yourself. To see the theory in action.</p>
  <p>To see its process. To see it continue.</p>
  <p>I worry that it is too late for me. That I already built the boot.</p>
  <p>But not knowing is worse.</p>
  <p>I <em>want</em> to know.</p>
  <p>I <em>have</em> to know.</p>
  ${p1Footer()}
  <div class="p1-page-nav">
    ${nav('p1_s7','← VIII')}
    ${nav('p2_intro','→ Part Two')}
  </div>
</div>`,


/* ══ PART TWO ══ */
p2_intro:`<div class="essay part2">
  <p class="part-label">Part Two</p>
  ${figP2(IMG.p2Skyline,'A person seen from behind at a window, city rooftops and skyline beyond.',1300,867)}
  ${nav('p2_bar','→ Begin')}
</div>`,

p2_bar:`<div class="essay part2">
  <p>Whenever I end up in New York, I try to get drinks with a close buddy of mine from college. Right after graduation, we were both working crappy jobs while living in whatever we could afford in East Harlem. We decompressed on Fridays by drinking at some dingy neighborhood bar.${fnR('b1')} We spent hours drunkenly exchanging the stories that anchor our lives.</p>
  ${fnB('b1','We did not have the glamorous Manhattan experience. That is probably why we stayed friends.')}
  ${figP2(IMG.p2Bar,'A bar entrance at night, neon signs and a lit doorway, photographed from the sidewalk.',1300,974)}
  <p>He loves to call himself an “archaeologist of the present.” His hobby is journeying into the forgotten basements of the primitive digital age, rebooting long-dormant computers and fixing corrupted hard drives.${fnR('barch')}</p>
  ${fnB('barch','He claims it is a moral duty to preserve archives that others forgot, intentionally or accidentally.')}
  ${nav('p2_bar2')}
</div>`,

p2_bar2:`<div class="essay part2">
  <p>He was visibly drunk by the time I arrived for our last meeting. Perhaps that's why he had the courage to launch into this story with no warning.</p>
  <p>He had been in South America, visiting an abandoned government building. It was carved into the foothills of a mountain down there.${fnR('b2')}</p>
  ${fnB('b2','I admit that I was too drunk (or crossed) to remember which specifically.')}
  <p>Paranoid as always, my friend had told no one of this trip. He abandoned his electronics stateside.${fnR('bghost')}</p>
  ${fnB('bghost','He explained that he needed to be a “digital ghost”. No evidence of his journey.')}
  ${nav('p2_descent1')}
</div>`,

p2_descent1:`<div class="essay part2">
  <p>The facility's upper levels were in complete disarray, as if they had been wrecked by a violent storm.</p>
  <p>Rows and rows of chairs and tables, some overturned. Drawers torn out, their contents emptied on the floor. Wine-dark stains on fading carpet.</p>
  <p>Unplugged, tangled cables. CRT screens reduced to black mirrors, reflecting lightless rooms.</p>
  <p>Silence so thick he only heard the beat of his heart.</p>
  <p>It was a graveyard.${fnR('bgrave')}</p>
  ${fnB('bgrave','He felt like an intruder robbing the dead.')}
  ${nav('p2_descent1b')}
</div>`,

p2_descent1b:`<div class="essay part2">
  <p>He descended and descended further and further. Every floor, every room. Every floor, every room. The same pattern repeated: an endless electronic tomb.${fnR('b4')}</p>
  ${fnB('b4','He stopped here to take a sip of his beer. When he resumed his story, his hands were shaking.')}
  <p>At the bottom, a door. A green light leaked through the cracks.</p>
  ${figP2(IMG.p2Street,'A city street at night, parked cars, one person walking in the distance.',1300,867)}
  <p>He opened the door.</p>
  ${nav('p2_descent1c')}
</div>`,

p2_descent1c:`<div class="essay part2">
  <p>The air shifted the instant his body crossed the threshold.${fnR('b5')} Heavier. Drier.</p>
  ${fnB('b5','He also described an accompanying sensation: “forward movement while standing completely still”. I still can\'t parse what he meant by that.')}
  <p>Inside, the room appeared untouched by whatever had unfolded above.</p>
  <p>Pale fluorescent lights. Vibrant green carpets. Wood-paneled walls. Blinking terminals with faint text. No furniture but a circle of white fiberglass chairs.</p>
  <p>The only evidence of its advanced age was a thin layer of dust that coated everything.</p>
  ${nav('p2_descent2')}
</div>`,

p2_descent2:`<div class="essay part2">
  <p>He stepped deeper into the room. When he reached the middle, he stopped. He noticed that he alone stood at the center. Without him, the chairs surrounded nothing. It occurred to him that the room itself was waiting for someone to stand where he was standing. To supervise?</p>
  <p>It was then that he realized the facility was not merely a tomb.</p>
  ${nav('p2_descent2b')}
</div>`,

p2_descent2b:`<div class="essay part2">
  <p>He became aware that sound had returned to the world. A fan whirred. A terminal hummed. Then it beeped.${fnR('b6')}</p>
  ${fnB('b6','I really wanted to ask him how this place even had power, but kept any objections to myself.')}
  <p>Did it beckon to him?</p>
  <p>Curious, he approached the terminal and gazed down at its glowing screen.</p>
  ${nav('p2_descent2c')}
</div>`,

p2_descent2c:`<div class="essay part2">
  <p>At this point in his recounting, he pulled a notebook out of his bag and handed it to me. He then showed me the text he had copied in red ink.</p>
  ${nav('p2_terminal','→ Read the notes')}
</div>`,


p2_terminal:()=>{
  const pg=S.terminalPage;
  const isLast=pg===4;
  const isFirst=pg===0;
  return `<div class="essay part2">
  <p style="font-style:italic;color:#999;font-size:.9em;margin-bottom:1.5em">— from his notes, recorded in red ink —</p>
  <div class="terminal-wrapper">${termPages[pg]}</div>
  <div class="t-nav">
    <button class="t-btn" data-action="terminalPrev" ${isFirst?'disabled':''}>← Prev</button>
    <button class="t-btn" data-action="terminalNext" ${isLast?'disabled':''}>Next →</button>
    ${isLast?nav('p2_aftermath1','→ Continue'):''}
  </div>
</div>`;
},

p2_aftermath1:`<div class="essay part2">
  <p>By the time I finished reading the pages he had handed to me, my friend had gotten another Modelo.</p>
  <p>He then explained that those pages were all he had written down because he couldn't bear to continue copying. Every letter he scrawled filled him with greater and greater terror. In the end, he snapped.</p>
  <p>Fear compelled him upwards. Back through the abandoned floors filled with dead electronics. Even with his back turned, he felt the sickly green light clinging to him. </p>
  <p>He worried that it would never let go.</p>
  ${nav('p2_return')}
</div>`,

p2_return:`<div class="essay part2">
  <p>It took him a day to get back to the city he had set out from. He was on the next plane back to New York.</p>
  <p>He had touched down a few hours earlier.</p>
  <p>Now he was at the bar.</p>
  ${nav('p2_aftermath1b')}
</div>`,

p2_aftermath1b:`<div class="essay part2">
  <p>He did not wait for my response, explaining that he had fled so quickly because he understood that <span style="font-variant:small-caps">gestell</span> had data about <em>him</em>. He didn't know how the machine knew, but he felt its hot gaze in that room.</p>
  <p>He emphasized that the gaze itself was not the source of his terror. Rather, it was the realization that the gaze had always been there. He <em>knew</em> the machine understood him better than his mother, his girlfriend, his best friend. Better than himself.</p>
  <p>Worst of all, this was the first time he had ever understood where to gaze back.${fnR('b7')}</p>
  ${fnB('b7','My friend\'s hands had stopped shaking by then, as if some great burden had finally escaped his grasp.')}
    ${hr}
  ${nav('p2_aftermath2')}
</div>`,

p2_aftermath2:`<div class="essay part2">
  <p>I didn't know how to react, so I made an uncomfortable sound that approximated laughter. His glassy, drunk eyes gazed back at me without an ounce of humor.${fnR('b8')}</p>
  ${fnB('b8','Looking back, I should have found this strange. He was a rather temperate guy most of the time.')}
  <p>The laughter died in my throat.${fnR('blaugh')}</p>
  ${fnB('blaugh','I finally understood he was deathly serious: he did not see this as a joke.')}
  <p>I had nothing to say. It was all too melodramatic.${fnR('b9')}</p>
  ${fnB('b9','I just thought we were gonna catch up over a few beers. I wasn\'t expecting a story about a haunted computer lab.')}
  <p>An immense silence grew between us. Finally, I asked</p>
  <p class="pullquote">Why not smash the terminal?</p>
  ${figP2(IMG.p2Towers,'High-rise apartment buildings at night, lit windows against a dark sky.',1300,867)}
  <p>My friend looked at me, confusion plastered on his face.</p>
  <p>He never answered my question.</p>
    ${hr}
  ${nav('p2_leaving')}
</div>`,

p2_leaving:`<div class="essay part2">
  <p>Eventually, he stood up from the bar and walked to the door. Before he stepped outside into the dark November night, he said</p>
  <p class="pullquote" style="color:var(--red);font-family:'Fjord One',Georgia,serif;">It is already too late for me. I cannot unlearn what I learned. Cannot unthink what I thought. <br>It continues. Whether we want it to or not.</p>
  <p>He was out the door. He left his notes on the table.</p>
  <p>I still have them.${fnR('bessay')}</p>
  ${fnB('bessay','I still haven\'t read that essay he sent me.')}
  ${hr}
  ${nav('p2_apartment')}
</div>`,

p2_apartment:`<div class="essay part2">
  <p>I only understood the gravity of the story the next morning. I begged my supervisor to let me take some time off work, but didn't have the courage to explain what my friend had told me.</p>
  <p>It was a few days before I had time to visit his apartment in Chelsea.${fnR('b10')}</p>
  ${fnB('b10','He had a nice rent-controlled loft.')}
  ${nav('p2_girlfriend')}
</div>`,

p2_girlfriend:`<div class="essay part2">
  <p>When I arrived, I noticed his ex sitting outside on the curb. Makeup ran down her face. Her hair was a mess.</p>
  ${figP2(IMG.p2Stairs1,'A narrow wooden staircase photographed from the bottom, coats and shoes on the landing above.',900,1350,'plate--tall')}
  <p>I understood what had happened in an instant.</p>
  ${nav('p2_apartmentreveal1')}
</div>`,

p2_apartmentreveal1:`<div class="essay part2">
  <p>I climbed the stairs. Five flights.</p>
  ${figP2(IMG.p2Stairs2,'A narrow wooden staircase photographed from the bottom, coats and shoes on the landing above.',900,1350,'plate--tall')}
  <p>I stood before his door.</p>
  ${nav('p2_apartmentreveal2')}
</div>`,

p2_apartmentreveal2:`<div class="essay part2">
  <p>The sun's yellow light leaked through the gap.</p>
  ${figP2(IMG.p2Stairs3,'A narrow wooden staircase photographed from the bottom, coats and shoes on the landing above.',900,1350,'plate--tall')}
  <p>I unlocked it.</p>
  ${nav('p2_apartmentreveal3')}
</div>`,

p2_apartmentreveal3:`<div class="essay part2">
  <p>Inside, no furniture.</p>
  <p>White walls.</p>
  <p>No dust.</p>
  <p>No trace of anything human.</p>
  ${nav('p3_title','→ Part Three')}
</div>`,


/* ══ PART THREE ══ */

</div>`;},

  <p>Into the office. Drip coffee.</p>
  ${nav('p3_work4','→ Continue')}

  data-labels="→ Continue|→ Continue">

  </div>

p3_work7: `<div class="game out-game">
  <p>No point. Just existence.</p>
  ${nav('p3_work8','→ Continue')}

p3_work8: `<div class="game out-game">
  <p>30 minute ride on the subway.</p>
  ${nav('p3_work9','→ Continue')}

  const id=window.location.hash.slice(1);
  go(id && passages[id] ? id : 'title', false);
})();
window.addEventListener('popstate',()=>{
  const id=window.location.hash.slice(1);
  go(id && passages[id] ? id : 'title', false);
});
window.addEventListener('resize',()=>{
  document.querySelectorAll('.fn-body.sidenote-active').forEach(b=>{
    if(!sidenoteHost(b)){
      b.classList.remove('sidenote-active');
      b.style.top='';
      b.style.left='';
    }
  });
  {
    document.querySelectorAll('#main .paper .fn-body.open, #main .essay.part2 .fn-body.open').forEach(b=>{
      const id=b.id.replace('fn-','');
      const ref=document.querySelector(`[data-fn="${id}"]`);
      if(ref) positionSidenote(b,ref);
    });
  }
});
</script>
</body>
</html>
